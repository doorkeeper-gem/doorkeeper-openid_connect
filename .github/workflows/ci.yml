name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: >-
      Ruby ${{ matrix.ruby }} (${{ matrix.gemfile }})
    env:
      CI: true
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    runs-on: ${{ matrix.os }}
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - head
        gemfile:
          - gemfiles/rails_7.0.gemfile
          - gemfiles/rails_7.1.gemfile
          - gemfiles/rails_7.2.gemfile
          - gemfiles/rails_8.0.gemfile
          - gemfiles/rails_8.1.gemfile
          - gemfiles/doorkeeper_master.gemfile
        exclude:
          - ruby: head
            gemfile: gemfiles/rails_7.0.gemfile
        # Oldest supported Doorkeeper series — one Ruby each is enough to
        # keep the `>= 5.5` gemspec constraint honest.
        include:
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.5.gemfile
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.6.gemfile
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.7.gemfile
          # Newest supported Doorkeeper major — pins the 6.0 series
          # (currently 6.0.0.beta1), which `doorkeeper_master.gemfile` stops
          # covering as soon as upstream `main` moves on. Keeps the `< 7.0`
          # cap honest.
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_6.0.gemfile
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        timeout-minutes: 10
        run: bundle exec rake spec
  e2e:
    name: E2E (${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    env:
      CI: true
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        # Short names (not gemfile paths like the build matrix) so they can
        # name the failure artifact below — expressions have no replace().
        gemfile:
          - rails_8.1
          - doorkeeper_master
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        timeout-minutes: 15
        working-directory: e2e
        run: npx playwright test

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.gemfile }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: /home/runner/bundle
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop
