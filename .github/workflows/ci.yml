name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: >-
      Ruby ${{ matrix.ruby }} (${{ matrix.gemfile }})
    env:
      CI: true
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    runs-on: ${{ matrix.os }}
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - head
        gemfile:
          - gemfiles/rails_7.0.gemfile
          - gemfiles/rails_7.1.gemfile
          - gemfiles/rails_7.2.gemfile
          - gemfiles/rails_8.0.gemfile
          - gemfiles/rails_8.1.gemfile
          - gemfiles/doorkeeper_master.gemfile
        exclude:
          # None of these Rails series will be made to work on a development
          # Ruby: 7.0, 7.1 and 7.2 have all passed the two-year security-fix
          # window Rails grants a series (7.2.0 shipped 2024-08-09), so nothing
          # lands there any more. The released Rubies still cover all three.
          #
          # 7.0 has been excluded since Ruby 3.4 landed. 7.1 and 7.2 joined
          # when json 3.0 — which ruby-head bundles — turned an unknown
          # keyword argument into an ArgumentError while ActiveSupport's
          # JSONGemEncoder still passed `quirks_mode: true`, so every
          # `render json:` raises. That one is fixed on Rails main and on
          # 8-0-stable, but neither fix reaches a 7.x series.
          - ruby: head
            gemfile: gemfiles/rails_7.0.gemfile
          - ruby: head
            gemfile: gemfiles/rails_7.1.gemfile
          - ruby: head
            gemfile: gemfiles/rails_7.2.gemfile
        # Oldest supported Doorkeeper series — one Ruby each is enough to
        # keep the `>= 5.5` gemspec constraint honest.
        include:
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.5.gemfile
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.6.gemfile
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_5.7.gemfile
          # Newest supported Doorkeeper major — pins the 6.0 series
          # (currently 6.0.0.beta1), which `doorkeeper_master.gemfile` stops
          # covering as soon as upstream `main` moves on. Keeps the `< 7.0`
          # cap honest.
          - ruby: "3.4"
            os: ubuntu-latest
            gemfile: gemfiles/doorkeeper_6.0.gemfile
    steps:
      - name: Repo checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not pinned: upstream ships setup-ruby from a moving `v1` branch, and a
      # pinned commit only offers the Rubies and runner images of its own day.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        timeout-minutes: 10
        run: bundle exec rake spec
  e2e:
    name: E2E (${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    env:
      CI: true
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        # Short names (not gemfile paths like the build matrix) so they can
        # name the failure artifact below — expressions have no replace().
        gemfile:
          - rails_8.1
          - doorkeeper_master
    steps:
      - name: Repo checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Cuprite drives the Chrome the runner image already ships, so the suite
      # needs nothing beyond the bundle.
      - name: Run E2E tests
        timeout-minutes: 15
        run: bundle exec rake e2e

      - name: Upload the pages of failed examples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.gemfile }}
          path: spec/dummy/tmp/e2e/
          retention-days: 7
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: /home/runner/bundle
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]'))
    steps:
      - name: Repo checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop
